# Python side of ModelsApp: the training logger (logger/) and the server
# (server/). Both are installed, editable, into .venv:
#
#   source env.sh && uv sync --all-packages
[tool.uv.workspace]
members = ["logger", "server"]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx2>=2.14.0",       # FastAPI's test client
  "torch>=2.4",           # logger tests and `modelsapp demo`
  "numpy>=2.2.6",         # keeps torch from warning that it's missing
  "psycopg[binary]>=3.2", # Postgres driver for the server tests
  "pgserver>=0.1",        # a throwaway Postgres for the server tests
  "pillow>=12.3.0",
]

[tool.pytest.ini_options]
testpaths = ["logger/tests", "server/tests"]
