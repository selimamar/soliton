# Python side of Soliton: the training logger (logger/) and the server
# (server/). Both are installed, editable, into .venv:
#
#   source env.sh && uv sync --all-packages
#
# The [project] below is only for hosting platforms that install from the
# repository's root with `uv sync` (Heroku): it pulls in the server with its
# PostgreSQL driver, and nothing else. It isn't a package of its own.
# docs/hosting.md has the Heroku steps; Procfile says how the server starts.
[project]
name = "soliton-workspace"
version = "0"
requires-python = ">=3.10"
dependencies = ["soliton-server[postgres]"]

[tool.uv]
package = false

[tool.uv.sources]
soliton-server = { workspace = true }

[tool.uv.workspace]
members = ["logger", "server"]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx2>=2.14.0",       # FastAPI's test client
  "torch>=2.4",           # logger tests and `soliton demo`
  "numpy>=2.2.6",         # keeps torch from warning that it's missing
  "psycopg[binary]>=3.2", # Postgres driver for the server tests
  "pgserver>=0.1",        # a throwaway Postgres for the server tests
  "pillow>=12.3.0",
]

[tool.pytest.ini_options]
testpaths = ["logger/tests", "server/tests"]
