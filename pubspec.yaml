name: soliton
description: Monitor your deep learning training runs from your phone.
publish_to: 'none'
version: 0.3.0+3

environment:
  # material_ui needs Flutter 3.47 / Dart 3.13.
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  # Path-based web URLs (/runs/x instead of /#/runs/x). Part of the Flutter SDK.
  flutter_web_plugins:
    sdk: flutter
  # Charts (line + bar charts with touch tooltips).
  fl_chart: ^1.3.1
  # State management and dependency injection.
  flutter_riverpod: ^3.5.0
  # Declarative navigation (URL-style routes such as /runs/:runId).
  go_router: ^18.1.4
  # Material widgets (replaces the deprecated package:flutter/material.dart).
  material_ui: ^1.11.0
  # Requests to the Soliton server.
  http: ^1.6.0
  # Live updates from the server.
  web_socket_channel: ^3.0.3
  # Remembers settings and the server address between launches.
  shared_preferences: ^2.5.6
  # The server token, in the Keychain or Keystore (data/services/token_store.dart).
  flutter_secure_storage: ^11.2.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    # iOS, iPadOS and macOS plugins come in through Swift Package Manager,
    # never CocoaPods, whatever a machine's own Flutter settings say.
    enable-swift-package-manager: true

  # The small app mark beside the runs list title (tool/make_icons.py).
  assets:
    - assets/branding/app_mark.png
    - assets/fonts/OFL-inter.txt
    - assets/fonts/OFL-sourceserif4.txt
    - assets/fonts/OFL-jetbrainsmono.txt
    - assets/fonts/OFL-spacegrotesk.txt
    - assets/fonts/OFL-stixtwotext.txt
    - assets/fonts/OFL-ibmplexmono.txt

  # Bundled, so the app looks the same offline. Paper uses Inter, Source
  # Serif 4 and JetBrains Mono; Ink uses STIX Two Text; Lab uses IBM Plex
  # Mono and Space Grotesk. SIL Open Font License:
  # assets/fonts/OFL-*.txt, registered in main.dart.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
        - asset: assets/fonts/SourceSerif4-Medium.ttf
          weight: 500
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: STIX Two Text
      fonts:
        - asset: assets/fonts/STIXTwoText-400.ttf
        - asset: assets/fonts/STIXTwoText-400Italic.ttf
          style: italic
        - asset: assets/fonts/STIXTwoText-500.ttf
          weight: 500
        - asset: assets/fonts/STIXTwoText-600.ttf
          weight: 600
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-400.ttf
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-600.ttf
          weight: 600
