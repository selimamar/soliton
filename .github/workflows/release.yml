# Publishes a release when a version tag is pushed (docs/releasing.md):
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# The tag must match `version` in pubspec.yaml (0.3.0 for 0.3.0+5). It builds
#   - Soliton-<version>.zip: the Mac app, unsigned (not notarised),
#   - Soliton-<version>.apk: the Android app, only if the release key is set
#     up as repository secrets (below); otherwise this part is skipped,
# attaches them to a GitHub Release, and updates the Homebrew cask in
# selimamar/homebrew-tap if a token for it is set up.
#
# Repository secrets (Settings → Secrets and variables → Actions), all
# optional:
#   ANDROID_KEYSTORE_BASE64    the release key: base64 -i soliton-release.jks | pbcopy
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias (soliton)
#   ANDROID_KEY_PASSWORD       the key's password (the same, for a .jks made by keytool)
#   TAP_TOKEN                  a fine-grained token with Contents: Read and
#                              write on selimamar/homebrew-tap only

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match pubspec.yaml's version ($version)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  mac:
    name: Mac app
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip the app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Soliton.app \
            "Soliton-${{ needs.version.outputs.version }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: Soliton-*.zip
          if-no-files-found: error

  android:
    name: Android app
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check for the release key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Android release key in the repository secrets: no APK in this release."
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.key.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - if: steps.key.outputs.present == 'true'
        name: Build the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SOLITON_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SOLITON_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SOLITON_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export SOLITON_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE" | base64 --decode > "$SOLITON_ANDROID_KEYSTORE"
          flutter pub get
          flutter build apk --release
          rm "$SOLITON_ANDROID_KEYSTORE"
          mv build/app/outputs/flutter-apk/app-release.apk \
            "Soliton-${{ needs.version.outputs.version }}.apk"
      - if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: Soliton-*.apk
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, mac, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - id: sha
        run: echo "sha256=$(sha256sum dist/Soliton-*.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Soliton ${{ needs.version.outputs.version }}" \
            --generate-notes

  tap:
    name: Update the Homebrew cask
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - name: Update selimamar/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::No TAP_TOKEN secret: update the cask by hand (version $VERSION, sha256 $SHA256)."
            exit 0
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/selimamar/homebrew-tap.git" tap
          cd tap
          sed -i -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" \
            Casks/soliton.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "The cask is already at $VERSION."
          else
            git commit -am "soliton $VERSION"
            git push
          fi
