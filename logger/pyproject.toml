[project]
name = "soliton"
version = "0.1.0"
description = "Send PyTorch training metrics and per-layer statistics to a Soliton server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Old enough for HPC clusters. Uses only the standard library; PyTorch is
# needed only for run.watch().
requires-python = ">=3.9"
dependencies = []
keywords = ["pytorch", "deep learning", "training", "monitoring", "simulation", "slurm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/selimamar/soliton"
Documentation = "https://github.com/selimamar/soliton/blob/main/docs/getting-started.md"
Issues = "https://github.com/selimamar/soliton/issues"

[project.scripts]
soliton = "soliton.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
