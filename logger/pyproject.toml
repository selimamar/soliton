[project]
name = "modelsapp"
version = "0.1.0"
description = "Send PyTorch training metrics and per-layer statistics to a ModelsApp server."
readme = "README.md"
# Old enough for HPC clusters. Uses only the standard library; PyTorch is
# needed only for run.watch().
requires-python = ">=3.9"
dependencies = []

[project.scripts]
modelsapp = "modelsapp.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
